[package]
name = "jobs-lambda"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Single binary, deployed to AWS Lambda via cargo-lambda. Runtime is
# `provided.al2023` (ARM64); see scripts/deploy-jobs.sh for the build
# + upload incantation.
#
# `name = "jobs-lambda"` matches the crate name so cargo-lambda's
# output lands at `target/lambda/jobs-lambda/bootstrap` (consistent
# with api-search). cargo-lambda always renames the final executable
# to `bootstrap` — that's what the `provided.al2023` runtime expects.
[[bin]]
name = "jobs-lambda"
path = "src/main.rs"

[dependencies]
ml-art-core = { path = "../core" }

# Async runtime — Lambda Rust uses tokio under the hood.
tokio = { workspace = true }

# Lambda Rust runtime + the SQS event type we destructure.
lambda_runtime = { workspace = true }
aws_lambda_events = { workspace = true }

# Errors + logging.
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

# SQS message bodies are JSON-encoded `JobEvent`s; deserialize here.
serde = { workspace = true }
serde_json = { workspace = true }

# T-052b — the kickoff handler enqueues per-user digest jobs back to SQS,
# so this Lambda is also a producer. Build the SQS client + load AWS
# config at boot.
aws-config = { workspace = true }
aws-sdk-sqs = { workspace = true }
