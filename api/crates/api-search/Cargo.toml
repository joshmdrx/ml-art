[package]
name = "api-search"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# Multiple bins in this crate; tell `cargo run -p api-search` (no
# `--bin` flag, as dev.sh and CI use it) to launch the main server.
default-run = "api-search"

[lib]
name = "api_search"
path = "src/lib.rs"

[[bin]]
name = "api-search"
path = "src/main.rs"

# One-shot ops tool: re-geocode a specific `artist_locations` row.
# Useful when the row got stamped `geocoded_at` while Mapbox was
# disabled, or when an artist's address change didn't trigger a fresh
# geocode for some reason. Invoke as:
#   cargo run -p api-search --bin regeocode -- <location-uuid>
[[bin]]
name = "regeocode"
path = "src/bin/regeocode.rs"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
sqlx = { workspace = true }
ml-art-core = { path = "../core" }
serde_json = { workspace = true }

[dependencies]
ml-art-core = { path = "../core" }

tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
lambda_http = { workspace = true }
lambda_runtime = { workspace = true }
sqlx = { workspace = true }
pgvector = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
