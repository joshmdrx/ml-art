[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/api-search",
    "crates/jobs-worker",
    "crates/jobs-lambda",
]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "signal"] }

# HTTP + Lambda — `lambda_http` lets the same handler run as Lambda or local Axum.
lambda_http = "0.13"
lambda_runtime = "0.13"
# Strongly-typed event structs for AWS Lambda triggers (SQS, S3, EventBridge…).
# default-features = false trims out the dozens of event types we don't
# use; sqs feature pulls in only the SqsEvent / SqsBatchResponse types.
aws_lambda_events = { version = "0.16", default-features = false, features = ["sqs"] }
axum = { version = "0.7", default-features = false, features = ["json", "query", "tokio", "http1", "matched-path", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
http = "1"
http-body-util = "0.1"

# DB
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate", "derive"] }
pgvector = { version = "0.4", features = ["sqlx"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (Jina, etc.)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

# Encoding image bytes into data URLs for Jina (lets us embed without
# requiring Jina to fetch the image from a public URL — important in
# dev where MinIO is on localhost).
base64 = "0.22"

# Auth
jsonwebtoken = "9"

# HMAC for tokenised inquiry reply-to addresses (T-054). A full JWT is
# too long for an email local-part (RFC 5321 caps it at 64 chars), so the
# reply address embeds a truncated HMAC-SHA256, hex-encoded.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Image pixel-dimension probe on /v1/uploads/image. Header-only reader
# — no full decode, no allocations beyond the first ~64 bytes — so it's
# essentially free per upload. Used to populate uploads.width/height and
# (downstream) artwork_images so the UI can render aspect-ratio
# placeholders without layout shift.
imagesize = "0.13"

# Errors + logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
url = "2"
once_cell = "1"
rand = "0.8"

# Env loading
dotenvy = "0.15"

# Rate limiting (in-process GCRA / leaky-bucket; swap for Redis at scale)
governor = "0.7"

# S3 (object storage; talks to MinIO in dev, real S3 in prod)
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.55"
aws-credential-types = "1.2"

# SQS — production JobsBackend driver. In dev, JobsBackend::Postgres
# still wins because no JOBS_QUEUE_URL is set; in prod the api Lambda
# gets one via env var and switches drivers at boot.
aws-sdk-sqs = "1.55"

# SSM — fetch the SecureString parameter tree at Lambda cold start
# and inject into the process env so Config::load() sees them as if
# they were native env vars. See core::config::ssm_bootstrap.
aws-sdk-ssm = "1.55"

# Sentry — error tracking. `rustls` to avoid pulling OpenSSL via
# Lambda's musl base image. `panic` catches Rust panics so we don't
# silently lose them when the process crashes. `tracing` ferries
# `tracing::error!` events as breadcrumbs + events to Sentry.
sentry = { version = "0.42", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "reqwest",
  "rustls",
  "tracing",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = 1
