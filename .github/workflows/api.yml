name: api

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "api/**"
      - "db/migrations/**"
      - ".github/workflows/api.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # sqlx::test creates per-test databases; this is the admin DB it connects to.
  DATABASE_URL: postgres://ml_art:dev@localhost:5432/ml_art_dev
  # Tests stub the embedder; no need for a real key in CI.
  JINA_API_KEY: ""

jobs:
  check:
    name: check / clippy / fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --workspace --all-targets

  test:
    name: integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ml_art
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: ml_art_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: cargo test
        run: cargo test --workspace --all-targets
