name: ml

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "ml/**"
      - ".github/workflows/ml.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create venv + install dev deps
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run pytest
        run: uv run pytest

      - name: Run ruff
        run: uv run ruff check ml_art tests
