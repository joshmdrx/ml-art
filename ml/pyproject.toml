[project]
name = "ml-art"
version = "0.1.0"
description = "ML and evaluation code for the art discovery platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "ipykernel>=6.29",
]
eval = [
    "anthropic>=0.40",
]
local = [
    "torch>=2.2",
    "transformers>=4.40,<5.0",
    "einops>=0.7",
    "timm>=0.9",
]
data = [
    "datasets>=2.18",
    "pyarrow>=14.0",
]
seed = [
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml_art"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
